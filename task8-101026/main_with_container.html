<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main With Container</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        *,
        *::before,
        *::after {
            margin: 0px;
            padding: px;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .main-box {
            max-width: 1200px;
            width: 90%;
            display: flex;
            align-items: center;
            padding: 4%;
            margin: 2% auto;
            min-height: 85vh;
            gap: 4%;
            border-radius: 10px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px, rgba(10, 37, 64, 0.35) 0px -2px 6px 0px inset;
        }

        .badge {
            background-color: #dde8fe;
            color: blue;
            border-radius: 13px;
            padding: 5px 10px;
            font-size: 16px;
        }

        .left-container {
            /* margin-right: 69px; */
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: start;
            width: 50%;
        }

        .left-container>h1 {
            color: #0b275f;
            font-size: 59px;
            line-height: 1.1;
        }

        .left-container>p {
            color: #6d7996;
            font-size: 22px;
        }

        .button-grp {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .get_started_btn {
            border-radius: 5px;
            color: white;
            background-color: #0269fd;
            padding: 12px 25px;
            border: 1px solid #0269fd;
            font-size: 18px;
            cursor: pointer;
        }

        .watch_video_btn {
            border: 1px solid #0269fd;
            color: #0269fd;
            background-color: white;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .con {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* .right-container {
            width: 44%;
        } */

        .card {
            flex: 1;
            border-right: 3px solid #e0e7f1;
            padding: 15px 10px;
            /* width: 100%; */
        }

        .card:last-child {
            border-right: none;
        }

        .card1 {
            text-align: center;
        }

        .card h3 {
            color: blue;
            font-size: 28px;
        }

        .card span {
            color: grey;
        }



        .online_learning {
            border-radius: 15px;
            width: 100%;
            display: block;
            height: auto;
        }

        .right-container {
            width: 50%;
            /* height: 80%; */
        }

        @media screen and (min-width:992px) and (max-width: 1200px) {
            .main-box {
                padding: 4%;
            }

            .left-container {
                gap: 10px;
            }

            .left-container>h1 {
                font-size: 45px;
            }

            .left-container p {
                font-size: 18px;
            }

            .button-grp {
                gap: 10px;
            }

            .left-container p {
                font-size: 18px;
            }

            .button-grp {
                gap: 10px;
            }

            .get_started_btn,
            .watch_video_btn {
                padding: 10px 15px;
                font-size: 16px;
            }
        }

        @media screen and (min-width:768px) and (max-width:991px) {
            .main-box {
                flex-direction: column;
                margin: 4% auto;
                max-width: 700px;
                width: 90%;
                padding: 4%;
                min-height: auto;
            }

            .left-container {
                gap: 10px;
            }

            .left-container>h1 {
                font-size: 50px;
                line-height: 50px;
            }

            .left-container>p {
                font-size: 20px;
            }

            .left-container,
            .right-container {
                width: 100%;
            }

            .right-container {
                height: 50%;
            }
        }


        @media screen and (max-width:767px) {
            .main-box {
                flex-direction: column;
                margin: 4% auto;
                width: 95%;
                padding: 4%;
                min-height: auto;
                gap: 30px;
            }

            .left-container,
            .right-container {
                width: 100%;
            }

            .left-container>h1 {
                font-size: 45px;
                line-height: 50px;
            }

            .right-container {
                height: 35%;
            }

        }

        @media screen and (max-width:460px) {
            .main-box {
                padding: 20px 20px;
                margin: 20px 2px;
                min-height: auto;
            }

            .button-grp {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }

            .get_started_btn,
            .watch_video_btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <section class="main-box">
        <div class="left-container">
            <span class="badge">Welcome to EduTech</span>
            <h1>Learn Today <br />Build Tomorrow</h1>
            <p>Join thousands of students and develop real-world skills with expert-led courses.</p>
            <div class="button-grp">
                <button class="get_started_btn"> Get Started <i class="fa-solid fa-arrow-right-long"></i></button>
                <button class="watch_video_btn"><i class="fa-solid fa-circle-play"></i> Watch Video</button>
            </div>
            <section class="con">
                <div class="card">
                    <h3>10K+</h3>
                    <span>Students</span>
                </div>
                <div class="card card1">
                    <h3>50+</h3>
                    <span>Courses</span>
                </div>
                <div class="card card1">
                    <h3>95%</h3>
                    <span>Success Rate</span>
                </div>
            </section>
        </div>
        <div class="right-container">
            <img src="./image.png" alt="online_learning" class="online_learning" />
        </div>

    </section>
</body>

</html>
